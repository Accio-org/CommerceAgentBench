<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RealReplicaBench</title>
  <desc id="desc">A stateful agent benchmark for real-world commerce workflows, developed by Accio.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#00B2FF"/>
    </linearGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#047857"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="softMix" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8FAF4"/>
      <stop offset="1" stop-color="#EEF7FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(929 42) rotate(151) scale(458 272)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D8AB" stop-opacity=".24"/>
      <stop offset=".42" stop-color="#91FFF1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111827" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#FFFFFF"/>
  <rect width="1200" height="360" rx="28" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="27.5" stroke="#E5E7EB"/>
  <rect x="28" y="0" width="1144" height="4" rx="2" fill="url(#accent)"/>

  <g transform="translate(56 44)">
    <rect width="266" height="32" rx="16" fill="#FFFFFF" stroke="#D1D5DB"/>
    <rect x="14" y="11" width="10" height="10" rx="3" transform="rotate(45 14 11)" fill="url(#accent)"/>
    <text x="34" y="21" fill="#374151" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="760" letter-spacing="1">STATEFUL AGENT BENCHMARK</text>

    <text x="0" y="100" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.7">RealReplicaBench</text>
    <text x="2" y="140" fill="#1F2937" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="560">Real workflows. Reproducible replicas. Verifiable outcomes.</text>

    <g transform="translate(0 172)" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="720">
      <rect width="136" height="38" rx="19" fill="#FFFFFF" stroke="#D1D5DB"/>
      <circle cx="20" cy="19" r="5" fill="#10B981"/>
      <text x="75" y="24" text-anchor="middle" fill="#374151">107 tasks</text>

      <rect x="148" width="222" height="38" rx="19" fill="#FFFFFF" stroke="#D1D5DB"/>
      <circle cx="168" cy="19" r="5" fill="#00B2FF"/>
      <text x="268" y="24" text-anchor="middle" fill="#374151">Browser · CLI · API · Files</text>

      <rect x="382" width="238" height="38" rx="19" fill="#FFFFFF" stroke="#D1D5DB"/>
      <circle cx="402" cy="19" r="5" fill="#059669"/>
      <text x="510" y="24" text-anchor="middle" fill="#374151">OpenClaw + Accio</text>
    </g>

    <g transform="translate(0 238)">
      <text x="0" y="18" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing=".6">DEVELOPED AND MAINTAINED BY</text>
      <text x="235" y="20" fill="url(#accentText)" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" letter-spacing="1.5">ACCIO</text>
    </g>
  </g>

  <g transform="translate(796 42)" filter="url(#shadow)">
    <rect width="350" height="276" rx="24" fill="#FFFFFF" stroke="#D1D5DB"/>
    <rect x="1" y="1" width="348" height="4" rx="2" fill="url(#accent)"/>

    <rect x="22" y="24" width="306" height="46" rx="13" fill="#F7FAF9" stroke="#E5E7EB"/>
    <rect x="38" y="40" width="12" height="12" rx="3" transform="rotate(45 38 40)" fill="url(#accent)"/>
    <text x="62" y="53" fill="#1F2937" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="760">Agent executes the workflow</text>

    <g transform="translate(22 88)" font-family="Inter, Arial, sans-serif">
      <rect width="144" height="56" rx="14" fill="#EEF7FF" stroke="#00B2FF" stroke-opacity=".24"/>
      <text x="72" y="23" text-anchor="middle" fill="#0369A1" font-size="11.5" font-weight="800" letter-spacing=".7">BROWSER</text>
      <text x="72" y="42" text-anchor="middle" fill="#111827" font-size="15" font-weight="800">28 tasks</text>

      <rect x="162" width="144" height="56" rx="14" fill="#E8FAF4" stroke="#10B981" stroke-opacity=".28"/>
      <text x="234" y="23" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="800" letter-spacing=".7">CLI</text>
      <text x="234" y="42" text-anchor="middle" fill="#111827" font-size="15" font-weight="800">53 tasks</text>

      <rect y="70" width="144" height="56" rx="14" fill="url(#softMix)" stroke="#10B981" stroke-opacity=".22"/>
      <text x="72" y="93" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="800" letter-spacing=".7">API / MCP</text>
      <text x="72" y="112" text-anchor="middle" fill="#111827" font-size="15" font-weight="800">10 tasks</text>

      <rect x="162" y="70" width="144" height="56" rx="14" fill="#F7FAF9" stroke="#D1D5DB"/>
      <text x="234" y="93" text-anchor="middle" fill="#374151" font-size="11.5" font-weight="800" letter-spacing=".7">FILES</text>
      <text x="234" y="112" text-anchor="middle" fill="#111827" font-size="15" font-weight="800">16 tasks</text>
    </g>

    <rect x="22" y="232" width="110" height="30" rx="15" fill="url(#accent)"/>
    <text x="77" y="252" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="820">STATEFUL</text>
    <rect x="218" y="232" width="110" height="30" rx="15" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".5"/>
    <text x="273" y="252" text-anchor="middle" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="820">VERIFIED</text>
  </g>
</svg>
