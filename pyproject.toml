[project]
name = "commerce-agent-bench"
version = "1.3.1"
description = "Benchmark harness and task suite for ecommerce and sourcing agent workflows (OpenClaw, 107 domain tasks)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Accio"},
]
keywords = ["agent", "benchmark", "ecommerce", "openclaw", "sourcing"]
classifiers = [
    "Development Status :: 4 - Beta",
    # The distributed Python package is the Apache-2.0 half of the repo. The
    # CC BY 4.0 task suite (datasets_domain_v1/) is not packaged — see
    # LICENSE-DATA and the License section of README.md.
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Verifier graders run on the HOST (cli.py:_run_verifier -> bash grader/run.sh),
# not inside the workstation image. Two datasets_domain_v1 graders import third-
# party libs and otherwise silently emit "openpyxl not installed" / "pyyaml import
# failed" -> zero-score the whole task family on a fresh ECS box that just did
# `pip install -e .`. Keep this list tight; only pin libs a grader uses today.
#   openpyxl - datasets_domain_v1/browser/web-research/electric-cargo-tricycle-market-report/grader/verify_task.py
#   PyYAML   - datasets_domain_v1/cli/commerce/camping-stove-listing-config/grader/verify_task.py
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://commerce-agent-bench.site.accio.ai"
Repository = "https://github.com/Accio-org/CommerceAgentBench"
"Mock showcase" = "https://commerce-agent-bench-mock-showcase.site.accio.ai"
Accio = "https://www.accio.com"

[project.scripts]
commerce-agent-bench = "bench_core.cli:main"
commerce-agent-bench-llm-judge = "bench_core.llm_judge_cli:main"

[tool.setuptools.packages.find]
include = ["bench_core*"]
