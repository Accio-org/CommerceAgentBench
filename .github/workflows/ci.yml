name: release-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Validate release structure
        run: python scripts/validate_release.py

      - name: Compile Python sources
        run: python -m compileall -q bench_core scripts

      - name: Test public API contracts
        run: python -m unittest discover -s tests -v

      - name: Exercise CLI discovery
        run: |
          commerce-agent-bench --version
          commerce-agent-bench --help
          test "$(commerce-agent-bench list | wc -l | tr -d ' ')" = "107"
