# RealReplicaBench — OpenClaw harness, PUBLIC Alibaba DashScope (native, sidecar-free).
#
# Bring-your-own-key: runs the agent against Alibaba Model Studio (DashScope)
#   https://dashscope-intl.aliyuncs.com/compatible-mode/v1/chat/completions
# with the standard OpenAI-compatible chat/completions wire format. The release
# config declares Qwen 3.7 Plus as text-and-image capable; actual availability
# and limits depend on the selected provider account.
# No private model proxy, no OpenRouter shim, no chat-completions sidecar.
#
#   DASHSCOPE_API_KEY=sk-... real-replica-bench run <task> \
#     --config configs/realreplicabench_openclaw_qwen37plus_native.yaml \
#     --run-id realreplicabench-qwen37plus-$(date +%Y%m%d-%H%M%S)
#
# HOW IT WORKS — the models_config JSON is the single source of truth:
#   configs/realreplicabench_qwen37plus_native_models.json declares provider
#   "qwen" with api=openai-completions, baseUrl=dashscope-intl.aliyuncs.com/
#   compatible-mode/v1, apiKey=${DASHSCOPE_API_KEY} (expanded from your env at
#   injection time → sent as the Authorization Bearer header). The `qwen/...`
#   model prefix auto-selects OpenClaw's bundled Qwen plugin (native streaming +
#   thinking wrapper), so the request goes STRAIGHT to DashScope. `openrouter/`
#   is the only prefix that triggers the auto-sidecar path.
#
# REQUIREMENTS:
#   * DASHSCOPE_API_KEY must be exported as an Alibaba Model Studio API key.
#     Manage keys at:
#       https://bailian.console.aliyun.com/#/api-key
#   * The container must reach dashscope-intl.aliyuncs.com — if your network
#     needs a proxy, pass it: -e HTTPS_PROXY=http://host.docker.internal:<port>.
#   * CN region: swap the JSON baseUrl to
#       https://dashscope.aliyuncs.com/compatible-mode/v1
#     API keys are region-specific; verify model entitlement before a full run.
#
# THINKING LEVEL — native (bundled qwen plugin), NO proxy:
#   Set `"reasoning": true` on the model in the models_config AND `thinking:
#   {low|medium|high}` below. OpenClaw's qwen plugin then injects the DashScope
#   native `enable_thinking` behavior. Not setting `reasoning: true` disables
#   thinking entirely (`thinking:` alone becomes a no-op on the native Qwen
#   path).
#
# VISION safety net:
#   qwen3.7-plus is multimodal so image_model can equal the primary model. The
#   release fork's vision precheck whitelist matches on the substring
#   "qwen3.7-plus"; older release forks (pre-2026-07) will abort at set-image
#   time until you add that substring to _OPENCLAW_VISION_MODEL_SUBSTRINGS in
#   harnesses/openclaw/runner.py.
#
# The benchmark image is public on Docker Hub:
#   docker pull acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859

run_id: realreplicabench-domain-v1-openclaw-qwen37plus-native
datasets_dir: datasets_domain_v1
collection: datasets_domain_v1/realreplicabench_domain_v1_all.collection.json
parallelism: 2

runtime:
  os: linux
  image: acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859
  platform: linux/amd64

harness: openclaw

openclaw:
  # Provider declared in the JSON: baseUrl=DashScope intl, apiKey=${DASHSCOPE_API_KEY},
  # api=openai-completions. The bundled qwen plugin recognises the `qwen`
  # provider id (aliases: modelstudio, qwencloud, dashscope) and wires up its
  # native streaming + thinking wrappers.
  models_config: configs/realreplicabench_qwen37plus_native_models.json
  # qwen/ prefix (!= openrouter/) -> native DashScope, no sidecar.
  model: qwen/qwen3.7-plus
  # qwen3.7-plus is itself multimodal, so serve image tools with the same model.
  image_model: qwen/qwen3.7-plus
  gateway_port: 18789
  gateway_ready_delay: 6
  # With "reasoning": true on the model (in the models_config), this makes the
  # bundled qwen provider path emit enable_thinking natively.
  thinking: high

judge:
  # Judge independently of the agent model — Gemini keeps this config self-
  # contained if you already have a GEMINI_API_KEY. Swap to provider=openai
  # when using an OpenAI-compatible judge endpoint.
  provider: gemini
  model: gemini-3.1-pro-preview
  timeout: 240

start_index: 1
