# RealReplicaBench — OpenClaw harness, native Google generateContent (sidecar-free).
#
# Use this when you want OpenClaw to speak Gemini's NATIVE generateContent API
# directly — no OpenAI chat-completions conversion hop. By default this points
# at Google's official Gemini endpoint; to route the same native Gemini wire
# format through a local proxy, set the provider baseUrl in the models_config
# JSON (NOT --openclaw-base-url — that flag is ignored on the native path; it
# only sets OPENROUTER_BASE_URL for the OpenRouter provider).
#
# Wire-contract probe (2026-07-28): the pinned public runtime emitted the
# versioned `…:streamGenerateContent?alt=sse` request to a local recorder and
# consumed a protocol-compatible response with no sidecar.
#
# HOW IT WORKS — one source of truth, the models_config JSON:
#   configs/realreplicabench_native_google_models.json declares a provider
#   (key "google") with:
#     - api: google-generative-ai   ← makes OpenClaw use the native generateContent
#                                      client (NOT "google-genai" — that string is
#                                      rejected by `openclaw config validate`)
#     - baseUrl                      ← official Gemini endpoint by default
#     - apiKey / timeoutSeconds / models (+ optional headers)
#   Then `model: google/gemini-3.5-flash` selects it. Because the model
#   prefix is NOT `openrouter/`, cli.py auto-detects native routing and starts no
#   sidecar (and `--openclaw-thinking` won't auto-start the OpenRouter shim).
#   No separate provider flag is needed — the provider name lives only in the
#   JSON key and the model prefix.
#
#   real-replica-bench run api-amazon-margin-floor-audit \
#     --config configs/realreplicabench_openclaw_native_google.yaml \
#     --run-id realreplicabench-native-google-$(date +%Y%m%d-%H%M%S)
#
# Notes:
#   * To route through a local Gemini-compatible proxy, edit the provider
#     `baseUrl` in the models_config JSON. The native provider reads BOTH its
#     baseUrl and apiKey ONLY from that JSON — `--openclaw-base-url` and
#     `--openclaw-api-key` are ignored on the native path (they target the
#     OpenRouter provider). If the proxy ignores the inbound key, any
#     placeholder apiKey works; the proxy supplies the real upstream auth.
#   * baseUrl must be reachable from INSIDE the container — on Docker Desktop use
#     host.docker.internal; on Linux pass the host IP / --add-host.
#   * The model id must carry the provider prefix matching the JSON key (google/…),
#     NOT openrouter/.
#   * This switches only the AGENT provider. The judge has its own --llm-judge-*
#     flags; set those to your proxy too when both roles use a private route.
#
# The benchmark image is public on Docker Hub:
#   docker pull acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859

run_id: realreplicabench-domain-v1-openclaw-native-google
datasets_dir: datasets_domain_v1
collection: datasets_domain_v1/realreplicabench_domain_v1_all.collection.json
parallelism: 2

runtime:
  os: linux
  image: acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859
  platform: linux/amd64

harness: openclaw

openclaw:
  # The provider is declared entirely in this JSON (api/baseUrl/apiKey/timeout/models).
  models_config: configs/realreplicabench_native_google_models.json
  # Provider-prefixed model id; `google/` (!= openrouter/) auto-selects native, no sidecar.
  model: google/gemini-3.5-flash
  image_model: google/gemini-3.5-flash
  gateway_port: 18789
  gateway_ready_delay: 6
  thinking: medium

judge:
  provider: gemini
  model: gemini-3.1-pro-preview
  # api_key falls back to the GEMINI_API_KEY env var.
  timeout: 240

start_index: 1
