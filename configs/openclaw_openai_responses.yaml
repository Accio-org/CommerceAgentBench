# Commerce Agent Bench — OpenClaw harness, OpenAI /v1/responses (Responses API).
#
# The Responses API is a distinct OpenAI wire format from /v1/chat/completions:
# it uses `input` (not `messages`), `text.format.json_schema` (not
# `response_format`), and supports first-class tools/reasoning on models like
# gpt-5.x and o-series. Use this preset when your endpoint (public OpenAI, or
# a proxy) speaks /v1/responses. Use the openai_chat preset when it speaks
# /v1/chat/completions instead.
#
# BYO steps:
#   1. Edit configs/openai_responses_models.json — models[].id,
#      baseUrl if not the public OpenAI URL, apiKey placeholder if not OPENAI_API_KEY.
#   2. Export the referenced env var.
#   3. Run:
#        OPENAI_API_KEY=sk-... real-replica-bench run <task> \
#          --config configs/openclaw_openai_responses.yaml
#
# HOW IT WORKS — the models_config JSON is the single source of truth:
#   configs/openai_responses_models.json declares provider
#   "openai" with api=openai-responses, baseUrl=api.openai.com/v1,
#   apiKey=${OPENAI_API_KEY} (sent as Authorization: Bearer ...). OpenClaw
#   POSTs to {baseUrl}/responses with the Responses-API request shape;
#   thinking/reasoning is emitted natively when the model entry sets
#   reasoning:true AND --openclaw-thinking is set.
#
# Wire-format valid enum values (from OpenClaw's config validator):
#   openai-completions, openai-responses, openai-codex-responses,
#   anthropic-messages, google-generative-ai, github-copilot,
#   bedrock-converse-stream, ollama, azure-openai-responses
# This preset pins openai-responses; the openai_chat preset next to it pins
# openai-completions.
#
# Notes:
#   * `--openclaw-base-url` and `--openclaw-api-key` are OpenRouter-scoped;
#     they are silently ignored on this native path. Edit the JSON to retarget.
#   * `thinking:` here maps to the Responses API's native reasoning fields via
#     the OpenClaw provider path; needs `"reasoning": true` on the model.
#   * The LLM judge is independent — set --llm-judge-* to share the endpoint.
#
# The benchmark image is public on Docker Hub:
#   docker pull acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859

run_id: domain-v1-openclaw-openai-responses
datasets_dir: datasets_domain_v1
collection: datasets_domain_v1/domain_v1_all.collection.json
parallelism: 2

runtime:
  os: linux
  image: acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859
  platform: linux/amd64

harness: openclaw

openclaw:
  models_config: configs/openai_responses_models.json
  # openai/ prefix (!= openrouter/) -> native /v1/responses, no sidecar.
  model: openai/gpt-5.5
  image_model: openai/gpt-5.5
  gateway_port: 18789
  gateway_ready_delay: 6
  # With "reasoning": true on the model entry, this makes the Responses-API
  # path emit native reasoning parameters.
  thinking: medium

judge:
  provider: gemini
  model: gemini-3.1-pro-preview
  timeout: 240

start_index: 1
