# Commerce Agent Bench — OpenClaw harness, full datasets_domain_v1 (107 tasks).
# Direct Google Gemini path: OpenClaw speaks the public Google Gemini
# generateContent API natively through configs/native_google_direct_models.json.
# You only need GEMINI_API_KEY; no OpenRouter config or sidecar.
#
#   GEMINI_API_KEY=... commerce-agent-bench run \
#     --config configs/openclaw_gemini.yaml
#
# The benchmark image is public on Docker Hub:
#   docker pull acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859

run_id: domain-v1-openclaw-gemini
datasets_dir: datasets_domain_v1
collection: datasets_domain_v1/domain_v1_all.collection.json
parallelism: 2

runtime:
  os: linux
  image: acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859
  platform: linux/amd64

harness: openclaw

openclaw:
  models_config: configs/native_google_direct_models.json
  model: google/gemini-3.5-flash
  image_model: google/gemini-3.5-flash
  gateway_port: 18789
  gateway_ready_delay: 6
  # With "reasoning": true in the models_config, OpenClaw emits native
  # generationConfig.thinkingConfig.thinkingLevel.
  thinking: medium

judge:
  provider: gemini
  model: gemini-3.1-pro-preview
  # api_key falls back to the GEMINI_API_KEY env var.
  timeout: 240

start_index: 1
