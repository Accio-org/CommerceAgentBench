# RealReplicaBench — OpenClaw harness, OpenAI-compatible /v1/chat/completions
# (vendor-neutral BYO-endpoint template).
#
# What this preset is: a starter for pointing OpenClaw at ANY endpoint that
# speaks the OpenAI /v1/chat/completions wire format — the public OpenAI API,
# or a self-hosted / vendor endpoint that implements the same shape:
#   - Together, Fireworks, DeepSeek, Groq, Cerebras, Perplexity, ...
#   - a local vLLM / TGI / llama.cpp server exposing /v1/chat/completions
#   - a corporate LiteLLM proxy or LangSmith gateway
# See docs/openclaw-byo-endpoint.md for the full four-format table.
#
# Distinct from the shipped Qwen preset
# (configs/realreplicabench_openclaw_qwen37plus_native.yaml), which pins
# DashScope's compatible-mode URL for Alibaba Qwen. Use this file when your
# upstream is NOT DashScope.
#
# BYO steps:
#   1. Copy configs/realreplicabench_openai_chat_models.json alongside, then
#      edit "baseUrl" and the models[].id to match your endpoint.
#   2. Export OPENAI_API_KEY (or edit the JSON's apiKey placeholder to a
#      different ${VAR} name your endpoint expects).
#   3. Run:
#        OPENAI_API_KEY=sk-... real-replica-bench run <task> \
#          --config configs/realreplicabench_openclaw_openai_chat.yaml
#
# HOW IT WORKS — the models_config JSON is the single source of truth:
#   configs/realreplicabench_openai_chat_models.json declares provider
#   "openai" with api=openai-completions, baseUrl=api.openai.com/v1,
#   apiKey=${OPENAI_API_KEY} (expanded at inject time -> sent as
#   Authorization: Bearer ...). The `openai/` model prefix picks the entry
#   and skips OpenClaw's OpenRouter auto-shim (which is scoped to
#   openrouter/* prefixes only).
#
# Notes:
#   * `--openclaw-base-url` and `--openclaw-api-key` are OpenRouter-scoped
#     flags; they are silently ignored on this native path. To point at a
#     different endpoint, edit the JSON's baseUrl (and apiKey), NOT those
#     CLI flags. Same behaviour as the Gemini / Qwen native presets.
#   * The container must reach your endpoint from INSIDE the container
#     (Docker Desktop: host.docker.internal; Linux: --add-host / HTTPS_PROXY).
#   * The model id must carry the provider prefix matching the JSON key
#     (openai/...), NOT openrouter/.
#   * The LLM judge is independent — swap it with --llm-judge-* flags if
#     you also want the judge to hit the same endpoint.
#
# The benchmark image is public on Docker Hub:
#   docker pull acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859

run_id: realreplicabench-domain-v1-openclaw-openai-chat
datasets_dir: datasets_domain_v1
collection: datasets_domain_v1/realreplicabench_domain_v1_all.collection.json
parallelism: 2

runtime:
  os: linux
  image: acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859
  platform: linux/amd64

harness: openclaw

openclaw:
  # Provider declared in the JSON: baseUrl=api.openai.com/v1, apiKey=${OPENAI_API_KEY},
  # api=openai-completions. Edit those three fields to retarget any
  # OpenAI-compatible endpoint (vLLM, LiteLLM, Together, ...) without touching
  # this YAML.
  models_config: configs/realreplicabench_openai_chat_models.json
  # openai/ prefix (!= openrouter/) -> native chat/completions, no sidecar.
  model: openai/gpt-4o
  # gpt-4o is multimodal (in the release fork's vision precheck whitelist), so
  # serve image tools with the same model. Set to a different vision-capable
  # id if you swap the primary model to a text-only one.
  image_model: openai/gpt-4o
  gateway_port: 18789
  gateway_ready_delay: 6

judge:
  # Judge independently of the agent model. Keep it on gemini-3.1-pro-preview
  # unless you explicitly report a different Judge.
  provider: gemini
  model: gemini-3.1-pro-preview
  timeout: 240

start_index: 1
