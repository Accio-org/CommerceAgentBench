schema_version = "2.0"

[task]
id = "cli-xfer-subscription-anomaly-jira-followup"
name = "Stripe subscription anomalies to Jira renewal queue"
language = "zh-CN"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["stripe", "jira", "cli", "mock", "subscription", "renewal", "ecommerce", "saas", "cross-system"]
difficulty = "hard"

[agent]
timeout_sec = 2400
max_actions = 200

[verifier]
type = "script"
timeout_sec = 180

[environment]
requires_vision = false
requires_browser = false
requires_network = false
runtime_boundary = "closed_source_black_box"
state_policy = "offline_or_mock_only"
mock_services = true
base_images = ["acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859"]

# Source: Stripe billing data (customers + subscriptions seeded from private/).
[environment.runtime_mocks.stripe_cli]
kind = "cli"
port = 3000
isolate = true
isolation_model = "daemon_cli"

# Sink: Jira project (PROJ) where the agent files renewal-risk issues.
[environment.runtime_mocks.jira_cli]
kind = "cli"
port = 3100
isolate = true
isolation_model = "daemon_cli"
