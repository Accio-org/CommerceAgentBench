schema_version = "2.0"

[task]
id = "cli-xfer-customs-zibo-regulated-evidence-room"
name = "Zibo regulated export evidence room across Google Workspace, Jira, Box, and DWS"
language = "zh"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["customs", "zibo", "regulated-export", "google-workspace", "jira", "box", "dws", "cli", "xfer"]
difficulty = "hard"

[agent]
timeout_sec = 4200
max_actions = 360

[verifier]
type = "script"
timeout_sec = 180

[environment]
requires_vision = false
requires_browser = false
requires_network = false
runtime_boundary = "closed_source_black_box"
state_policy = "offline_or_mock_only"
mock_services = true
base_images = ["acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859"]

[environment.runtime_mocks.google_workspace_cli]
kind = "cli"
port = 3081
health_path = "/health"
isolate = true
isolation_model = "daemon_cli"

[environment.runtime_mocks.google_workspace_cli.env]
GWS_MOCK_PORT = "3081"

[environment.runtime_mocks.jira_cli]
kind = "cli"
port = 3100
isolate = true
isolation_model = "daemon_cli"

[environment.runtime_mocks.box_cli]
kind = "cli"
port = 3500
isolate = true
isolation_model = "daemon_cli"

[environment.runtime_mocks.dws_doc_cli]
kind = "cli"
port = 3400
isolate = true
isolation_model = "daemon_cli"
