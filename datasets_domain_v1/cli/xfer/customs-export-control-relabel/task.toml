schema_version = "2.0"

[task]
id = "cli-xfer-customs-export-control-relabel"
name = "Battery export supplier reclassification per updated export control policy"
language = "zh"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["customs", "export-control", "jira", "todoist", "notion", "cli", "xfer", "scope-trap"]
difficulty = "hard"

[agent]
timeout_sec = 3600
