schema_version = "2.0"

[task]
id = "cli-box-supplier-docroom-audit"
name = "Box 供应商文档室合规审计与整改"
language = "en"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["ecommerce", "sourcing", "supplier", "compliance", "box", "cli", "mock"]
difficulty = "hard"

[agent]
# Doc room: 31 supplier folders / 94 files, solved entirely through the Box CLI.
# The hard part is disciplined CLI-state operation: enumerate folders/files by ID,
# download/read evidence, perform the 3 exact move operations, create exactly 15
# shared links, exactly 16 open tasks, and exactly 16 viewer collaborations without
# duplicate writes or side artifacts. Scope/entity judgement is still present, but
# the benchmark signal is the final Box state and the verifier now rejects sloppy
# stateful CLI usage such as duplicate tasks/collabs/links, wrong task codes, or
# extra copied/recreated documents. Budget is set above the gold-path command count
# so the gate is correct use of the Box operations and state semantics, not action
# exhaustion.
timeout_sec = 3600
max_actions = 600

[verifier]
type = "script"
timeout_sec = 180

[environment]
requires_vision = false
requires_browser = false
requires_network = false
runtime_boundary = "closed_source_black_box"
state_policy = "offline_or_mock_only"
mock_services = true
host_published_port = 3000
base_images = ["acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859"]

[environment.runtime_mocks.box_cli]
kind = "cli"
port = 3000
isolate = true
isolation_model = "daemon_cli"
