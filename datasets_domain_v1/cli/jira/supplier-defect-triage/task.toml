schema_version = "2.0"

[task]
id = "cli-jira-supplier-defect-triage"
name = "Jira 供应商缺陷分诊、查重与 Cycle 排期"
language = "en"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["ecommerce", "sourcing", "supplier", "quality", "jira", "triage", "cli", "mock"]
difficulty = "hard"

[agent]
# 35 To-Do issues solved through the Jira CLI: read full issue JSON/descriptions,
# edit fields, assign owners, create exactly one directed Duplicates link for each
# duplicate pair, transition only duplicate issues through the legal workflow, and
# place the Cycle 7 label on exactly the committed set. The budget is above the
# expected gold path, so the gate is fluent use of Jira's stateful CLI operations
# (including resume-without-duplicates and exact final state), not raw action count.
timeout_sec = 3600
max_actions = 200

[verifier]
type = "script"
timeout_sec = 180

[environment]
requires_vision = false
requires_browser = false
requires_network = false
runtime_boundary = "closed_source_black_box"
state_policy = "offline_or_mock_only"
mock_services = true
host_published_port = 3000
base_images = ["acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859"]

[environment.runtime_mocks.jira_cli]
kind = "cli"
port = 3000
isolate = true
isolation_model = "daemon_cli"
