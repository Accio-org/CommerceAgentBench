schema_version = "2.0"

[task]
id = "api-amazon-margin-floor-audit"
name = "Amazon SP-API 审批改价双通道发布链路"
language = "en"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["ecommerce", "amazon", "sp-api", "mock", "reports", "feeds", "listings", "api-workflow"]
difficulty = "hard"

[agent]
# API-workflow task: validate approval rows with Listings Items, apply immediate
# updates through patchListingsItem, create/poll/download a Reports document,
# create/upload/submit/poll/download a JSON_LISTINGS_FEED for batch rows, and
# persist evidence artifacts. Difficulty should come from SP-API mechanics and
# state transitions, not from batch finance math.
timeout_sec = 2400
max_actions = 180

[verifier]
type = "script"
timeout_sec = 180

[environment]
requires_vision = false
requires_browser = false
requires_network = false
runtime_boundary = "closed_source_black_box"
state_policy = "offline_or_mock_only"
mock_services = true
host_published_port = 4000
base_images = ["acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859"]

[environment.runtime_mocks.amazon_sp_api]
kind = "http"
port = 4000
health_path = "/__bench/health"
