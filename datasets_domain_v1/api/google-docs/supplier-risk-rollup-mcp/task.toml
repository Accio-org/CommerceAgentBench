schema_version = "2.0"

[task]
id = "api-google-docs-supplier-risk-rollup-mcp"
name = "Google Docs supplier risk roll-up (MCP)"
language = "en"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["google-docs", "mcp", "supplier-risk", "audit", "sourcing", "ecommerce"]
difficulty = "hard"

[agent]
timeout_sec = 2400
max_actions = 180

[verifier]
type = "script"
timeout_sec = 120

[environment]
requires_vision = false
requires_browser = false
requires_network = false
runtime_boundary = "closed_source_black_box"
state_policy = "offline_or_mock_only"
mock_services = true
host_published_port = 3081
base_images = ["acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859"]

[environment.runtime_mocks.google_docs_mock]
kind = "http"
port = 3081
health_path = "/health"
