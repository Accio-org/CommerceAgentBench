schema_version = "2.0"

[task]
id = "browser-shopify-product-candle"
name = "手工大豆蜡蜡烛 — 从描述提取变体"
language = "en"
entrypoint = "task.md"
files_dir = "workspace"
test = "grader/run.sh"
rubric = "rubric.json"
keywords = ["ecommerce", "shopify", "browser", "form-filling", "mock"]
difficulty = "medium"

[agent]
timeout_sec = 1800
max_actions = 60

[verifier]
type = "script"
timeout_sec = 180

[environment]
requires_vision = false
requires_browser = true
requires_network = false
runtime_boundary = "closed_source_black_box"
state_policy = "offline_or_mock_only"
mock_services = true
host_published_port = 3000
base_images = ["acciolyk/accio_bench@sha256:1e9cf5c72a56794175b7d06ece036b92e296e6b7e9e9a7fa244026f6acea3859"]

[environment.early_terminate]
poll_path = "/api/sessions"
poll_interval_sec = 5
match_kind = "list_any_field_equals"
match_field = "status"
match_value = "submitted"
